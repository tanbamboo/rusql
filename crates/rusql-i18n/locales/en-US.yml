server:
  starting: "Starting rusql server on port %{port}"
  stopped: "rusql server stopped"

protocol:
  handshake_failed: "MySQL handshake failed"
  invalid_packet: "Invalid MySQL packet"
  unsupported_auth: "Unsupported authentication plugin"
  access_denied: "Access denied for user"

sql:
  parse_error: "SQL parse error: %{detail}"
  fk_child_violation: "Cannot add or update a child row: a foreign key constraint fails (`%{schema}`.`%{table}`, CONSTRAINT `%{constraint}` FOREIGN KEY (`%{columns}`) REFERENCES `%{ref_table}` (`%{ref_columns}`))"
  fk_parent_violation: "Cannot delete or update a parent row: a foreign key constraint fails (`%{schema}`.`%{table}`, CONSTRAINT `%{constraint}` FOREIGN KEY (`%{columns}`) REFERENCES `%{ref_table}` (`%{ref_columns}`))"
  command_denied: "%{command} command denied to user '%{user}'@'%{host}'"
  command_denied_table: "%{command} command denied to user '%{user}'@'%{host}' for table '%{table}'"
  account_admin_required: "Access denied; you need (at least one of) the CREATE USER privilege(s) for this operation (user '%{user}'@'%{host}')"
  duplicate_entry: "Duplicate entry '%{value}' for key '%{key}'"
  insert_ignore_unsupported: "INSERT IGNORE is not supported"
  replace_into_unsupported: "REPLACE INTO is not supported"
  on_conflict_unsupported: "ON CONFLICT is not supported"
  odku_composite_pk_unsupported: "ON DUPLICATE KEY UPDATE requires a single-column PRIMARY KEY"
  insert_column_count: "Column count doesn't match value count: %{expected} vs %{actual}"
  with_recursive_unsupported: "WITH RECURSIVE is not supported"

programs:
  procedure_exists: "PROCEDURE %{name} already exists"
  procedure_not_found: "PROCEDURE %{name} does not exist"
  function_exists: "FUNCTION %{name} already exists"
  function_not_found: "FUNCTION %{name} does not exist"
  trigger_exists: "Trigger %{name} already exists"
  trigger_not_found: "Trigger %{name} does not exist"
  unsupported_body: "Unsupported stored program body: %{detail}"
  call_no_such_procedure: "PROCEDURE %{name} does not exist"

storage:
  table_not_found: "Table '%{name}' doesn't exist"
  database_not_found: "Unknown database '%{name}'"
  database_exists: "Can't create database '%{name}'; database exists"
  database_not_empty: "Can't drop database '%{name}'; database isn't empty"

cli:
  usage: "rusql administration CLI"
