# Rust profile sensors
# crate_path: Cargo workspace root

crate_path: .

fast:
  - name: rustfmt
    command: cargo fmt --all -- --check
    description: rustfmt formatting check
  - name: clippy
    command: cargo clippy --all-targets --all-features -- -D warnings
    description: Clippy lints as errors

standard:
  - name: test
    command: cargo test
    description: Unit and integration tests
  - name: check
    command: cargo check --all-targets
    description: Fast compile check

ci:
  - name: build-release
    command: cargo build --release
    description: Release build verification
  - name: test-doc
    command: cargo test --doc
    description: Doc test examples
  - name: harness-validate
    command: node scripts/harness-validate.mjs
    description: Harness structure validation
  - name: doc-parity
    command: node scripts/doc-parity.mjs
    description: en/zh-CN user-guide section parity
  - name: handoff-check
    command: node scripts/check-handoff.mjs
    description: HANDOFF.md freshness (strict on main)
  - name: changelog-check
    command: node scripts/check-changelog.mjs
    description: CHANGELOG and release-notes structure
  - name: book-check
    command: node scripts/check-book.mjs
    description: mdBook chapter structure en/zh parity
  - name: mysql-diff
    command: node scripts/mysql-diff.mjs
    description: Optional rusql vs MySQL 8.0 differential compat (Docker)

error_format: |
  Include: rustc/clippy lint name (e.g. clippy::unwrap_used), file:line:col, and suggested fix.
