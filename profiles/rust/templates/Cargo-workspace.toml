[workspace]
members = ["packages/*-rust", "packages/rust-*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
thiserror = "2"
anyhow = "1"

# 团队 fork 后复制到仓库根，或单 crate 项目仅用 templates/Cargo.toml
