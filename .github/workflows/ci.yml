name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  harness-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/harness-validate.mjs
      - run: node scripts/check-book.mjs
      - run: node scripts/doc-parity.mjs
      - run: node scripts/check-changelog.mjs

  rust:
    runs-on: ubuntu-latest
    needs: harness-validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --release

  mysql-diff:
    runs-on: ubuntu-latest
    needs: harness-validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - run: node scripts/mysql-diff.mjs

  mysql-test-subset:
    runs-on: ubuntu-latest
    needs: harness-validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/mysql-test-subset.mjs
