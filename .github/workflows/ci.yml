name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  harness-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/harness-validate.mjs
      - run: node scripts/check-book.mjs
      - run: node scripts/doc-parity.mjs
      - run: node scripts/check-changelog.mjs

  rust:
    runs-on: ubuntu-latest
    needs: harness-validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --release

  mysql-diff:
    runs-on: ubuntu-latest
    needs: harness-validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MySQL 8.0 client
        run: sudo apt-get update && sudo apt-get install -y mysql-client-core-8.0
      - run: mysql --version
      - run: cargo build --release -p rusql-server
      - name: Oracle mysql CLI multi_schema gate
        run: RUSQL_ORACLE_MYSQL=1 cargo test -p rusql-server spawned_release_server_official_mysql_multi_schema -- --nocapture
      - run: node scripts/mysql-diff.mjs

  mysql-protocol-smoke:
    runs-on: ubuntu-latest
    needs: harness-validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MySQL 8.0 client
        run: sudo apt-get update && sudo apt-get install -y mysql-client-core-8.0
      - run: mysql --version
      - run: node scripts/mysql-diff.mjs --smoke-only

  mysql-test-subset:
    runs-on: ubuntu-latest
    needs: harness-validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/mysql-test-subset.mjs
