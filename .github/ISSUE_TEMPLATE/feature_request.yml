name: Feature Request
description: Suggest a feature for rusql
title: "[feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Target Milestone
      options:
        - M1 Protocol
        - M2 SQL Core
        - M3 Storage
        - M4 Indexes
        - M5 Compat
        - M6+ Long-term
